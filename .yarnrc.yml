nodeLinker: node-modules

# ---------------------------------------------------------------------------
# Supply-chain guards
# ---------------------------------------------------------------------------

# Refuse to resolve any npm version published less than a week ago. Compromised
# releases are almost always caught and unpublished within hours, so waiting out
# that window avoids the whole class of attack.
#
# Applies to every resolution -- `yarn add`, `yarn up`, lockfile refreshes,
# local and CI alike -- which makes it the backstop for Dependabot *security*
# updates, since those deliberately ignore dependabot.yml's `cooldown`.
#
# It does not fail an install: Yarn resolves to the newest version in range that
# is old enough. `yarn install --immutable` against a complete lockfile does no
# resolution, so CI is unaffected. Requires Yarn >= 4.12.
npmMinimalAgeGate: '7d'

# Publish @road-signs/* packages to the public npm registry.
npmScopes:
  road-signs:
    npmRegistryServer: 'https://registry.npmjs.org/'
    npmAuthToken: '${NPM_JS_AUTH:-}'
