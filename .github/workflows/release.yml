name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Changesets needs the full history to compute diff vs. baseBranch.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # Compile every workspace's dist/. Country packages need this because
      # `files` in package.json includes `dist/` and that's what gets shipped.
      # Note: this is `yarn compile`, NOT `yarn build` — the latter re-scrapes
      # every country (hours-long, requires Wikimedia rate-limiting), which is
      # not what we want on CI. The country signs.generated.ts files are
      # checked into git and are the source of truth for releases.
      - name: Compile workspaces
        run: yarn compile

      # Changesets action does two things depending on the repo state:
      #   1. If there are unconsumed changesets in .changeset/: open or update
      #      a "Version Packages" PR that runs `version` and bumps versions.
      #   2. If the merge to main consumed the version PR: run `publish` to
      #      push the bumped packages to npm.
      - name: Create release PR or publish
        uses: changesets/action@v2
        with:
          # v2 renamed every input and takes the token as an input rather than
          # from the environment; it refuses to run when a mismatched
          # GITHUB_TOKEN is also present. Setting the env var does not
          # configure the action at all, which is how v1 did it.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-script: bash scripts/publish-when-enabled.sh
          version-script: yarn changeset version
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Opt-in switch. Until this repository variable is 'true' the publish
          # path is a no-op, so a merge cannot mass-publish the scope before
          # trusted publishing is configured.
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
