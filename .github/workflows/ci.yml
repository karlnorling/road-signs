name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-type-check:
    name: Lint, type-check, validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: manypkg check
        run: yarn check

      - name: Lint
        run: yarn lint

      - name: Type-check
        run: yarn type-check

      - name: Validate category unions
        run: yarn validate-categories

      - name: Test
        run: yarn test
