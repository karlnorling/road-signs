name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-type-check:
    name: Lint, type-check, validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: manypkg check
        run: yarn check

      # GitHub Actions only *warns* when an action is passed an input it does
      # not declare, so an action major bump that renames inputs fails
      # silently. The release workflow runs only on push to main, where such a
      # regression lands before anyone sees it. Fails on an undeclared input;
      # deprecations only warn.
      - name: Audit GitHub Action inputs
        run: yarn audit-actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: yarn lint

      # Country packages import types from @road-signs/core, which only exist
      # once it has been compiled. Without this the type-check fails on a clean
      # checkout with:
      #   src/types.ts(1,73): error TS2307: Cannot find module '@road-signs/core'
      - name: Compile workspace packages
        run: yarn compile

      - name: Type-check
        run: yarn type-check

      - name: Validate category unions
        run: yarn validate-categories

      - name: Test
        run: yarn test
