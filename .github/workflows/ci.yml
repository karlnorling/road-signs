name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-type-check:
    name: Lint, type-check, validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: manypkg check
        run: yarn check

      - name: Lint
        run: yarn lint

      - name: Compile workspace packages
        run: yarn compile

      - name: Type-check
        run: yarn type-check

      - name: Validate category unions
        run: yarn validate-categories

      # The generated registries carry @ts-nocheck, so type-check never looks
      # inside them. This checks the payload itself: artwork present, IDs
      # unique and derivable, and the five hand-maintained country lists in
      # agreement with the packages on disk.
      - name: Validate registries
        run: yarn validate-registries

      - name: Test
        run: yarn test

      # The docs build used to be gated only by the deploy workflow, which runs
      # *after* CI passes — so an Astro break landed on main and only failed at
      # deploy time. Building here keeps that on the PR.
      - name: Build docs
        run: yarn build-docs
